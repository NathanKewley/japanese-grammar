  // Set the theme before the first paint, so dark mode doesn't flash.
  try { var t = localStorage.getItem('grammarNotebook.theme'); } catch (e) {}
  t = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#0A0A0C' : '#FAFAFA');
</script>
