<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714%27%20fill%3D%27%236E5AE0%27/%3E%3Ctext%20x%3D%2732%27%20y%3D%2745%27%20font-size%3D%2738%27%20text-anchor%3D%27middle%27%20fill%3D%27white%27%20font-family%3D%27sans-serif%27%3E%E6%96%87%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日本語">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFAFA">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Library — JLPT Grammar</title>
<!-- Web fonts load without holding up the page: text shows in the fallback font until they arrive. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap"></noscript>
<link rel="stylesheet" href="style.css">
<script src="../shared/staging.js"></script>
</head>
<body>

<!-- Laid out like the study apps' bar: home, title, then the controls. -->
<header class="app-header">
  <a class="home-btn" href="../index.html" title="All study apps" aria-label="All study apps"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a>
  <div class="app-heading">
    <h1 class="app-title">Grammar Library</h1>
    <p class="app-subtitle">JLPT grammar, N5 to N1</p>
  </div>
  <div class="header-controls">
    <label class="furigana-chip" title="Show readings over kanji">
      <input type="checkbox" id="furiganaToggle" checked>
      <span>Furigana</span>
    </label>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
  </div>
</header>

<nav class="tab-bar" id="tabBar"></nav>

<main class="app-main">
  <div class="search-wrap" id="searchWrap">
    <input type="text" class="search-input" id="searchInput" placeholder="Search grammar points…" autocomplete="off">
  </div>
  <div id="pageHeading"></div>
  <div id="mainContent"></div>
</main>

<div class="worksheet-modal" id="worksheetModal" hidden>
  <div class="worksheet-backdrop" id="worksheetBackdrop"></div>
  <div class="worksheet-panel" role="dialog" aria-modal="true" aria-labelledby="worksheetTitle">
    <div class="worksheet-toolbar">
      <div class="worksheet-toolbar-actions">
        <button class="worksheet-check" id="worksheetCheck" type="button">✓ Check Answers</button>
        <button class="worksheet-regenerate" id="worksheetRegenerate" type="button">↻ New Worksheet</button>
      </div>
      <button class="worksheet-close" id="worksheetClose" type="button" aria-label="Close worksheet">✕</button>
    </div>
    <div class="worksheet-content" id="worksheetContent"></div>
  </div>
</div>

<script src="grammar-data.js"></script>
<script src="reference-data.js"></script>
<script src="alignment.js"></script>
<script src="grammar-core.js"></script>
<script src="app.js"></script>
</body>
</html>
