<script>
  // Set the theme before the first paint, so dark mode doesn't flash.
  try { var t = localStorage.getItem('grammarNotebook.theme'); } catch (e) {}
  document.documentElement.setAttribute('data-theme', t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
</script>
