<title>Vibe Reading</title>
<meta name="description" content="132 graded Japanese readings from N5 to N1, with tappable words and spaced-repetition re-reading.">
<link rel="stylesheet" href="../shared/core.css">
<script>
  // Set the theme before the first paint, so dark mode doesn't flash.
  try { var t = localStorage.getItem('grammarNotebook.theme'); } catch (e) {}
  t = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#0A0A0C' : '#FAFAFA');
</script>
</head>
<body data-app="reading">
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
