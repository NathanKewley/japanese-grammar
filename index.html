<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Grammar — JLPT Grammar Library</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div>
    <h1 class="app-title">Japanese Grammar</h1>
    <p class="app-subtitle">JLPT grammar library</p>
  </div>
  <div class="header-controls">
    <label class="furigana-toggle-wrap">
      <span class="furigana-toggle-label">Furigana</span>
      <span class="switch">
        <input type="checkbox" id="furiganaToggle" checked>
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </span>
    </label>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
  </div>
</header>

<nav class="tab-bar" id="tabBar"></nav>

<main class="app-main">
  <div class="search-wrap" id="searchWrap">
    <input type="text" class="search-input" id="searchInput" placeholder="Search grammar points…" autocomplete="off">
  </div>
  <div id="pageHeading"></div>
  <div id="mainContent"></div>
</main>

<div class="worksheet-modal" id="worksheetModal" hidden>
  <div class="worksheet-backdrop" id="worksheetBackdrop"></div>
  <div class="worksheet-panel" role="dialog" aria-modal="true" aria-labelledby="worksheetTitle">
    <div class="worksheet-toolbar">
      <div class="worksheet-toolbar-actions">
        <button class="worksheet-check" id="worksheetCheck" type="button">✓ Check Answers</button>
        <button class="worksheet-regenerate" id="worksheetRegenerate" type="button">↻ New Worksheet</button>
      </div>
      <button class="worksheet-close" id="worksheetClose" type="button" aria-label="Close worksheet">✕</button>
    </div>
    <div class="worksheet-content" id="worksheetContent"></div>
  </div>
</div>

<script src="grammar-data.js"></script>
<script src="reference-data.js"></script>
<script src="alignment.js"></script>
<script src="app.js"></script>
</body>
</html>
